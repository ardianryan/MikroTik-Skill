name: NetDevOps Linter

on:
  push:
    paths:
      - '**.rsc'
      - 'src/safety/linter.ts'
  pull_request:
    paths:
      - '**.rsc'
      - 'src/safety/linter.ts'

permissions:
  contents: read

jobs:
  lint-rsc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Execute NetDevOps Linter Tests
        run: npx tsx --test test/linter.test.ts
