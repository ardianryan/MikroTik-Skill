name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Create Package Tarball
        id: pack
        run: |
          PACKAGE_FILE=$(npm pack)
          echo "package_file=$PACKAGE_FILE" >> $GITHUB_OUTPUT
          echo "Packed archive: $PACKAGE_FILE"

      - name: Generate Release Notes from CHANGELOG
        id: changelog
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag_name }}"
          VERSION="${TAG#v}"
          echo "Extracting release notes for version: $VERSION"
          node -e "
            const fs = require('fs');
            const version = process.argv[1];
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const startTag = '## [' + version + ']';
            const startIndex = content.indexOf(startTag);
            if (startIndex !== -1) {
              const afterStart = content.slice(startIndex + startTag.length);
              const endMatch = afterStart.search(/\n##\s+/);
              const body = (endMatch !== -1 ? afterStart.slice(0, endMatch) : afterStart).replace(/^[^\n]*\n/, '').trim();
              fs.writeFileSync('release_notes.md', body);
            } else {
              fs.writeFileSync('release_notes.md', 'Release ' + version);
            }
          " "$VERSION"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: "Release ${{ github.ref_name || github.event.inputs.tag_name }}"
          body_path: release_notes.md
          files: |
            ${{ steps.pack.outputs.package_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (if NPM_TOKEN is provided)
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@${{ github.repository_owner }}/mikrotik-skill';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --registry=https://npm.pkg.github.com || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
